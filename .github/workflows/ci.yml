name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint, test, dbt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Latest 3.11.x; .python-version pins the exact patch for local pyenv.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Black
        run: black --check .

      - name: Flake8
        run: flake8 .

      - name: Unit tests
        run: pytest tests/ -v

      - name: dbt build (DuckDB, synthetic Bronze fixture)
        env:
          LAKE_ROOT: ${{ github.workspace }}/.ci_lake
        run: |
          mkdir -p data
          python scripts/make_fred_fixture.py --lake-root "$LAKE_ROOT"
          cd dbt && dbt build --profiles-dir .

  compose:
    name: Compose + Airflow image + DAG imports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: docker compose -f docker/compose.yaml --profile core config -q

      - name: Build Airflow image
        run: docker compose -f docker/compose.yaml --profile core build airflow-scheduler

      - name: DAGs import cleanly in the real image
        run: |
          docker run --rm \
            -v "$PWD/dags:/opt/airflow/dags" \
            -v "$PWD/ingestion:/opt/airflow/project/ingestion" \
            -e PYTHONPATH=/opt/airflow/project \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            rpof-airflow:3.4.0 python -c "
          import sys
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag('/opt/airflow/dags', include_examples=False)
          for path, err in bag.import_errors.items():
              print(f'{path}: {err}')
          print('DAGs:', sorted(bag.dag_ids))
          expected = {'platform_smoke_test', 'ingest_fred', 'dbt_build'}
          sys.exit(1 if bag.import_errors or not expected <= set(bag.dag_ids) else 0)
          "

      - name: dbt is runnable in the image
        run: docker run --rm rpof-airflow:3.4.0 /opt/dbt-venv/bin/dbt --version

      - name: Great Expectations imports in the image
        run: docker run --rm rpof-airflow:3.4.0 python -c "import great_expectations as gx; print(gx.__version__)"
