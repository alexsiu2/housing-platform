# Weekly metro news outlook (design doc §9.4, D17). Read by llm/summarize.py.

# Haiku 5.5: ~$0.20/month at this scope with the Batch API. If the outlooks
# read as weak or poorly cited, switch to claude-sonnet-5-5 (~$3/month).
model: claude-haiku-5-5
# Thinking is on by default on Haiku 5.5; effort trades depth for tokens.
effort: medium
# Thinking counts toward max_tokens; the answer itself is ~500 tokens.
max_tokens: 16000

# File in llm/prompts/ (without .md). Stored on every row; bump it when the
# prompt changes so old and new outlooks can be told apart.
prompt_version: metro_outlook_v1

metros:
  # The N metros with the most scored zips, plus a national outlook.
  top_n_by_scored_zips: 20
  # Fewer items than this in the week: no outlook is written (not an empty one).
  min_items: 3

input:
  # Per metro, newest first.
  max_items: 80
  snippet_chars: 400
  # Haiku 5.5 bills prompts over 100K tokens at 5x; stay far below it. Items
  # are dropped (oldest first) until the estimate fits.
  max_prompt_tokens: 40000

guardrails:
  # Share of summary sentences that must cite at least one input item.
  min_citation_coverage: 0.6
  # Fewer items than this that the model judges relevant: no outlook (not
  # retried). Metro tags come from GDELT locations, which catch off-topic stories.
  min_relevant_items: 2
