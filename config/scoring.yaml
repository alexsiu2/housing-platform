# Opportunity score configuration (design doc §7). Change weights here, not in
# code, and bump weights_version: every scoring run records it, and any change
# should ship with a before/after comparison of the top 50 (§7.5).
#
# v1.1 (from v1.0, see design doc §7.6):
#   - score_entry_price uses price_to_income_ratio. v1.0 used
#     price_to_rent_ratio, which is exactly 1 / gross yield, so 45% of the
#     score rode on one ratio.
#   - Missing metro job growth scores neutral (50) instead of having its
#     weight redistributed, which had lifted no-job-data small towns to
#     half of the top 20.
weights_version: v1.1

# Sub-score -> raw metric in gold_zip_investment_metrics, direction, weight.
# Weights must sum to 1.
sub_scores:
  score_rental_yield:
    metric: gross_rental_yield_pct
    direction: higher        # higher yield = better
    weight: 0.30
  score_rent_growth:
    metric: rent_growth_1yr_pct
    direction: higher
    weight: 0.25
  score_affordability:
    metric: rent_to_income_ratio
    direction: lower         # rent is a smaller share of local income
    weight: 0.20
  score_entry_price:
    metric: price_to_income_ratio
    direction: lower         # cheaper to buy relative to local incomes
    weight: 0.15
  score_demand_growth:
    metric: yoy_job_growth_pct
    direction: higher
    weight: 0.10
    missing: neutral         # no metro job data -> 50 (median), flagged partial

# §7.4: a zip is scored only if these are all present. Any other missing
# sub-score follows its `missing` policy ("redistribute" its weight, the
# default, or score it "neutral" = 50); either way partial_score = true.
required: [score_rental_yield, score_rent_growth, score_affordability]

# Tier cut-offs on the 0-100 composite.
tiers:
  strong: 70
  moderate: 45

# Eligibility rules not in the design doc (kept explicit and tunable):
eligibility:
  # ACS median income for tiny ZCTAs has huge margins of error and would
  # swing the affordability sub-score; skip them.
  min_population: 1000
  # Job growth older than this (vs the snapshot month) counts as missing.
  max_job_data_lag_months: 3
