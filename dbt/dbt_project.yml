
name: 'housing_platform'
version: '1.0.0'

profile: 'housing_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Medallion layers. Bronze lives in Delta tables written by ingestion and is
# read as dbt sources; dbt owns staging, silver and gold.
models:
  housing_platform:
    staging:
      +materialized: view
      +schema: staging
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
