version: 2

seeds:
  - name: gdelt_excluded_sources
    description: >
      News domains excluded from GDELT housing tone: press-release wires and
      auto-generated stock-news sites, whose templated posts GDELT tags as
      housing finance. Review and extend freely; one row per domain.
    columns:
      - name: source
        data_tests: [unique, not_null]

  - name: metro_aliases
    description: >
      Principal-city aliases per metro for tagging news (design §9.3),
      generated by scripts/make_metro_aliases.py from the scored metros and
      editable by hand. bare_ok marks city names unambiguous enough to tag
      without a state ("Denver" yes, "Washington" no).
    config:
      column_types:
        cbsa_code: varchar
        bare_ok: boolean
    data_tests:
      - unique_combination:
          arguments:
            columns: [cbsa_code, city, state_abbr]
