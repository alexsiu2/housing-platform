version: 2

models:
  - name: silver_macro_indicators
    description: >
      National FRED macro indicators, one row per month. Weekly series are
      monthly averages; lower-frequency series are forward-filled, with
      *_observed_month showing where each value came from.
    columns:
      - name: month
        data_tests: [unique, not_null]
      - name: mortgage_rate_30yr
        description: Average 30-year fixed mortgage rate in the month (%).
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 25}
      - name: unemployment_rate
        description: National unemployment rate (%).
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 30}
      - name: housing_starts_k
        description: Housing starts, thousands of units (SAAR).
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 5000}
      - name: cpi_shelter
        description: CPI-U shelter index.
      - name: case_shiller_hpi
        description: S&P CoreLogic Case-Shiller U.S. National Home Price Index.
      - name: median_sale_price
        description: Median sales price of houses sold in the US ($), quarterly, forward-filled.
      - name: cpi_shelter_yoy_pct
        description: Year-over-year % change in CPI shelter.
      - name: case_shiller_hpi_yoy_pct
        description: Year-over-year % change in Case-Shiller national HPI.

  - name: silver_rent_index
    description: Zillow ZORI typical market rent by zip and month, with 1-year growth.
    data_tests:
      - unique_combination:
          arguments: {columns: [zip, month]}
    columns:
      - name: zip
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]
      - name: rent_index
        description: >
          Typical monthly market rent ($), smoothed. Real values reach ~$100k
          in Hamptons summer-rental zips (11930, 11963, 11976), often from a
          single month of listings; > $50k only warns. The hard bound catches
          unit errors (e.g. cents).
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: 100, max_value: 250000}
          - value_between:
              name: rent_index_luxury_outlier_warning
              arguments: {min_value: 100, max_value: 50000}
              config: {severity: warn}
      - name: rent_growth_1yr_pct
        description: "% change vs exactly 12 months earlier; null if that month is missing."
        data_tests:
          - value_between:
              arguments: {min_value: -75, max_value: 300}

  - name: silver_home_values
    description: >
      Zillow ZHVI typical home value (mid tier) by zip and month, with 1-year
      growth and the zip's primary CBSA.
    data_tests:
      - unique_combination:
          arguments: {columns: [zip, month]}
    columns:
      - name: zip
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]
      - name: home_value
        description: Typical home value ($), smoothed and seasonally adjusted.
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: 1000, max_value: 100000000}
      - name: home_value_growth_1yr_pct
        data_tests:
          - value_between:
              arguments: {min_value: -75, max_value: 300}
      - name: cbsa_code
        description: Primary metro (most residential addresses); null outside any CBSA.

  - name: silver_zip_cbsa_xwalk
    description: Zip -> CBSA pairs from the latest HUD vintage; is_primary marks one CBSA per zip.
    data_tests:
      - unique_combination:
          arguments: {columns: [zip, cbsa_code]}
    columns:
      - name: zip
        data_tests: [not_null]
      - name: cbsa_code
        data_tests: [not_null]
      - name: res_ratio
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}

  - name: silver_tract_zip_xwalk
    description: Census tract -> zip residential allocation from the latest HUD vintage.
    data_tests:
      - unique_combination:
          arguments: {columns: [tract, zip]}
    columns:
      - name: tract
        data_tests: [not_null]
      - name: res_ratio
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}

  - name: silver_zip_demographics
    description: >
      ACS 5-year demographics by zip (ZCTA) and vintage. Suppressed estimates
      are null.
    data_tests:
      - unique_combination:
          arguments: {columns: [zip, vintage_year]}
    columns:
      - name: zip
        data_tests: [not_null]
      - name: median_household_income
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1000000}
      - name: renter_share
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}

  - name: silver_metro_job_growth
    description: Metro total nonfarm employment (thousands, NSA) by month with YoY growth.
    data_tests:
      - unique_combination:
          arguments: {columns: [cbsa_code, month]}
    columns:
      - name: cbsa_code
        data_tests: [not_null]
      - name: yoy_job_growth_pct
        description: >
          % change vs exactly 12 months earlier. COVID swings are real and
          large: Elkhart-Goshen, IN (21140, RV manufacturing) went -35% in
          Apr 2020 and +54.5% in Apr 2021. Beyond +/-40% only warns.
        data_tests:
          - value_between:
              arguments: {min_value: -75, max_value: 75}
          - value_between:
              name: job_growth_extreme_swing_warning
              arguments: {min_value: -40, max_value: 40}
              config: {severity: warn}

  - name: silver_zip_lending_activity
    description: >
      HMDA home-purchase originations by zip and year with investor share and
      YoY loan-count change. Estimates: tracts allocated to zips by HUD res_ratio.
    data_tests:
      - unique_combination:
          arguments: {columns: [zip, activity_year]}
    columns:
      - name: zip
        data_tests: [not_null]
      - name: investor_purchase_share
        description: Share of home-purchase originations for investment property (occupancy_type 3).
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}

  - name: silver_zip_hazard
    description: >
      FEMA NRI expected annual building loss by zip (% of building value),
      total and per peril, with a national percentile. Context only, not scored.
    columns:
      - name: zip
        data_tests: [unique, not_null]
      - name: eal_rate_pct
        description: Expected annual building loss from natural hazards, % of building value.
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: 0, max_value: 10}
      - name: is_high_hazard
        description: In the riskiest 10% of zips nationally by eal_rate_pct.
      - name: top_peril_share
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}

  - name: silver_gdelt_metro_tone
    description: >
      GDELT US housing news by metro and ISO week: volume and average tone.
      See is_low_sample and is_national_policy_hub before reading tone.
    data_tests:
      - unique_combination:
          arguments: {columns: [cbsa_code, week_start]}
    columns:
      - name: avg_tone
        data_tests:
          - value_between:
              arguments: {min_value: -100, max_value: 100}
      - name: article_count
        data_tests:
          - value_between:
              arguments: {min_value: 1, max_value: 1000000}

  - name: silver_gdelt_national_tone
    description: US housing news per ISO week (each article once).
    columns:
      - name: week_start
        data_tests: [unique, not_null]

  - name: silver_news_items
    description: >
      Streamed news items (RSS, live GDELT) deduped across sources and tagged
      with metros (design §9.3). Grain: item_key x metro_tag, where metro_tag
      is a CBSA code or 'national'. metro_tag_method says how it was tagged
      (gdelt_geo, keyword, national). Input to the weekly LLM outlook.
    data_tests:
      - unique_combination:
          arguments:
            columns: [item_key, metro_tag]
    columns:
      - name: item_key
        data_tests: [not_null]
      - name: metro_tag
        data_tests: [not_null]
      - name: metro_tag_method
        data_tests:
          - accepted_values:
              arguments:
                values: [subreddit, gdelt_geo, keyword, national]
      - name: week_start
        data_tests: [not_null]
