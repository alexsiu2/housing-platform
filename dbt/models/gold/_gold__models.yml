version: 2

models:
  - name: gold_zip_investment_metrics
    description: >
      Score inputs by zip and month (design doc §6.4, §7.1). Only zips with
      both a Zillow rent and home value. ACS and job data are joined
      point-in-time (see model header).
    data_tests:
      - unique_combination:
          arguments: {columns: [zip, month]}
    columns:
      - name: zip
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]
      - name: gross_rental_yield_pct
        description: 12 x rent / home value x 100.
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: 0, max_value: 30}
      - name: price_to_rent_ratio
        description: Home value / annual rent.
        data_tests:
          - value_between:
              name: price_to_rent_ratio_design_range
              arguments: {min_value: 5, max_value: 60}
              config: {severity: warn}
      - name: rent_to_income_ratio
        description: Annual rent / median household income (0.3 = 30% of income).
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 10}
          - value_between:
              name: rent_to_income_above_one_warning
              arguments: {min_value: 0, max_value: 1}
              config: {severity: warn}
      - name: yoy_job_growth_pct
        description: Metro YoY job growth (latest BLS month <= this month); null outside CES metros.
      - name: job_growth_month
        description: BLS month the job growth came from.
