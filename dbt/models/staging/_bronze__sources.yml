version: 2

# Bronze Delta tables written by ingestion/. Loaded into DuckDB on each run by
# dbt-duckdb's delta plugin. LAKE_ROOT defaults to the local object store; CI
# points it at a local fixture directory instead.
#
# Column tests live on the staging models, not here: tests on a plugin source
# would each reload the table and collide when run in parallel.

sources:
  - name: bronze
    schema: bronze
    meta:
      plugin: delta
      materialization: table
    tables:
      - name: fred_series_raw
        description: FRED observations, one row per (series_id, date). Upserted on each load.
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/fred_series_raw"
          storage_options: &lake_storage
            AWS_ENDPOINT_URL: "{{ env_var('STORAGE_ENDPOINT', 'http://localhost:8333') }}"
            AWS_ACCESS_KEY_ID: "{{ env_var('STORAGE_ACCESS_KEY', 'rpof-local') }}"
            AWS_SECRET_ACCESS_KEY: "{{ env_var('STORAGE_SECRET_KEY', 'rpof-local-secret') }}"
            AWS_REGION: "{{ env_var('STORAGE_REGION', 'us-east-1') }}"
            AWS_ALLOW_HTTP: "true"

      - name: zori_raw
        description: Zillow Observed Rent Index by zip, melted long, one row per (zip, month).
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/zori_raw"
          storage_options: *lake_storage

      - name: zhvi_raw
        description: Zillow Home Value Index (mid tier) by zip, one row per (zip, month).
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/zhvi_raw"
          storage_options: *lake_storage

      - name: hud_crosswalk_raw
        description: >
          HUD USPS crosswalks, every loaded vintage. One row per
          (crosswalk_type, vintage, zip, geoid).
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/hud_crosswalk_raw"
          storage_options: *lake_storage

      - name: census_acs_raw
        description: Census ACS 5-year estimates by ZCTA, long format, one row per (zcta, variable, vintage_year).
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/census_acs_raw"
          storage_options: *lake_storage

      - name: fema_nri_raw
        description: >
          FEMA National Risk Index by census tract (2020 tracts): building value
          and expected annual building loss, total and per peril. One row per
          (tract, nri_release).
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/fema_nri_raw"
          storage_options: *lake_storage

      - name: gdelt_housing_articles_raw
        description: >
          US housing news articles from GDELT's GKG, filtered in BigQuery
          (ingestion/sql/gdelt_housing_articles.sql). One row per article_id.
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/gdelt_housing_articles_raw"
          storage_options: *lake_storage

      - name: news_events_raw
        description: >
          News items streamed through Kafka (RSS feeds and live GDELT;
          Reddit later) by jobs/stream_news_to_bronze.py. One row per
          (source, source_id); written by Spark every 15 minutes.
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/news_events_raw"
          storage_options: *lake_storage

      - name: bls_ces_raw
        description: BLS CES total nonfarm employment (NSA, thousands) by metro series and month.
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/bls_ces_raw"
          storage_options: *lake_storage

  - name: silver_spark
    description: >
      Aggregates produced by Spark jobs (jobs/), read as dbt sources (design
      §6.1). Written by Spark/Delta; read here through delta-rs.
    schema: silver_spark
    meta:
      plugin: delta
      materialization: table
    tables:
      - name: zip_lending_activity
        description: >
          HMDA home-purchase originations allocated from census tracts to zips
          (HUD res_ratio). One row per (zip, activity_year). Counts are estimates.
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/silver_spark/zip_lending_activity"
          storage_options:
            AWS_ENDPOINT_URL: "{{ env_var('STORAGE_ENDPOINT', 'http://localhost:8333') }}"
            AWS_ACCESS_KEY_ID: "{{ env_var('STORAGE_ACCESS_KEY', 'rpof-local') }}"
            AWS_SECRET_ACCESS_KEY: "{{ env_var('STORAGE_SECRET_KEY', 'rpof-local-secret') }}"
            AWS_REGION: "{{ env_var('STORAGE_REGION', 'us-east-1') }}"
            AWS_ALLOW_HTTP: "true"
