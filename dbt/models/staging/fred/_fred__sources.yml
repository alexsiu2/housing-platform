version: 2

sources:
  - name: bronze
    description: >
      Bronze Delta tables written by ingestion/. Loaded into DuckDB on each run
      by dbt-duckdb's delta plugin. LAKE_ROOT defaults to the local object store;
      CI points it at a local fixture directory instead.
    schema: bronze
    meta:
      plugin: delta
      materialization: table
    tables:
      - name: fred_series_raw
        description: >
          FRED observations, one row per (series_id, date). Upserted on each load.
          Column tests live on stg_fred__observations: tests on a plugin source
          would each reload the table and collide when run in parallel.
        meta:
          delta_table_path: "{{ env_var('LAKE_ROOT', 's3://rpof-lake') }}/bronze/fred_series_raw"
          storage_options:
            AWS_ENDPOINT_URL: "{{ env_var('STORAGE_ENDPOINT', 'http://localhost:8333') }}"
            AWS_ACCESS_KEY_ID: "{{ env_var('STORAGE_ACCESS_KEY', 'rpof-local') }}"
            AWS_SECRET_ACCESS_KEY: "{{ env_var('STORAGE_SECRET_KEY', 'rpof-local-secret') }}"
            AWS_REGION: "{{ env_var('STORAGE_REGION', 'us-east-1') }}"
            AWS_ALLOW_HTTP: "true"
