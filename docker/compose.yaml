# Local platform for the Rental Property Opportunity Finder.
#
#   make up          -> core profile (object storage + Airflow)
#   make down
#
# Later phases add profiles: spark, streaming (Phase 6), observability.
# Based on the official Airflow 3.4.0 docker-compose, trimmed to
# LocalExecutor (no Redis/Celery) to keep laptop memory use low.
#
# Credentials below are local-only development defaults.

name: rpof

x-producer: &producer
  build:
    context: ..
    dockerfile: docker/producers/Dockerfile
  image: rpof-producers:1
  profiles: [streaming]
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
  volumes:
    - ../streaming:/app/streaming:ro
    - ../config:/app/config:ro
    - ../ingestion:/app/ingestion:ro
  depends_on:
    schema-registry:
      condition: service_healthy
  mem_limit: 256m
  restart: unless-stopped

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/airflow/Dockerfile
  image: rpof-airflow:3.4.0
  env_file:
    - path: ../.env
      required: false
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-rpof-local-jwt-secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: rpof
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Project code is mounted at /opt/airflow/project and importable from DAGs.
    PYTHONPATH: /opt/airflow/project
    # Inside the compose network, storage is reached by service name.
    STORAGE_ENDPOINT: http://seaweedfs:8333
    STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rpof-local}
    STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-rpof-local-secret}
    # dbt (dags/dbt_build.py) writes the warehouse into the mounted data/ dir,
    # the same file `make dbt-build` uses on the host.
    DUCKDB_PATH: /opt/airflow/project/data/rpof.duckdb
    # Keep dbt inside the Docker VM's headroom (see dbt/profiles.yml).
    # Measured on the full ZHVI table: ~1.1 GB peak with these vs ~2.3 GB with
    # DuckDB defaults, which got the task OOM-killed in a shared 8 GB VM.
    DBT_DUCKDB_MEMORY_LIMIT: ${DBT_DUCKDB_MEMORY_LIMIT:-1GB}
    DBT_DUCKDB_THREADS: ${DBT_DUCKDB_THREADS:-1}
    DBT_THREADS: ${DBT_THREADS:-1}
    # Spark (profile `spark`): jobs/ are submitted from Airflow in client mode.
    SPARK_MASTER_URL: spark://spark-master:7077
    # Kafka (profile `streaming`, Phase 6): stream_news_to_bronze runs Spark in
    # local mode inside the task, so it needs no Spark cluster.
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    AIRFLOW_CONN_SPARK_LOCAL: '{"conn_type": "spark", "host": "local[2]"}'
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/adc.json
    GCP_PROJECT: ${GCP_PROJECT:-}
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs/airflow:/opt/airflow/logs
    - ../ingestion:/opt/airflow/project/ingestion
    - ../dbt:/opt/airflow/project/dbt
    - ../data:/opt/airflow/project/data
    - ../scoring:/opt/airflow/project/scoring
    - ../serving:/opt/airflow/project/serving
    - ../config:/opt/airflow/project/config
    - ../jobs:/opt/airflow/project/jobs
    # Keyless GCP auth for GDELT (BigQuery): only the ADC file, read-only. It
    # impersonates the least-privilege reader service account; see README.
    - ${GCP_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/opt/airflow/gcp/adc.json:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    profiles: [core]
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  storage-init:
    <<: *airflow-common
    profiles: [core]
    entrypoint: ["python", "-m", "ingestion.storage", "--create-buckets"]
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy

  postgres:
    image: postgres:16
    profiles: [core]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    profiles: [core]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    profiles: [core]
    command: api-server
    ports:
      # Override with AIRFLOW_PORT if 8080 is taken by another stack.
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    profiles: [core]
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    profiles: [core]
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    profiles: [core]
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --- profile: spark (Phase 5) ---------------------------------------------
  # Standalone Spark: one master + one worker. The driver runs in the Airflow
  # scheduler (client mode), so jobs need the core profile too:
  #   make up-spark
  spark-master:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    image: rpof-spark:4.2.0
    profiles: [spark]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    hostname: spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: 512m
      # Advertise the name clients use (spark://spark-master:7077); by default
      # the master advertises its container IP and binds only that address.
      SPARK_MASTER_HOST: spark-master
    ports:
      - "${SPARK_UI_PORT:-8090}:8080"   # master UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/json/ | grep -q ALIVE"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  spark-worker:
    image: rpof-spark:4.2.0
    profiles: [spark]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2560m}
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  # --- profile: streaming (Phase 6) -----------------------------------------
  # Kafka (KRaft, one broker) + Schema Registry + Kafka UI + the producers.
  # Kafka is a replayable buffer (7-day topics); Bronze Delta is the source of
  # truth. Needs the core profile for the stream job:  make up-streaming
  kafka:
    image: apache/kafka:4.3.2
    profiles: [streaming]
    hostname: kafka
    environment:
      CLUSTER_ID: 9mQllbLHR-K6EEhsGCYLpQ  # fixed base64 UUID; data lives in kafka-data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Producers create their topics (with retention) explicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.3
    profiles: [streaming]
    hostname: schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget: a plain HTTP request over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [streaming]
    environment:
      KAFKA_CLUSTERS_0_NAME: rpof
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      JAVA_OPTS: -Xmx256m
    ports:
      - "${KAFKA_UI_PORT:-8091}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  rss-producer:
    <<: *producer
    command: python -m streaming.rss_producer

  gdelt-producer:
    <<: *producer
    command: python -m streaming.gdelt_producer

volumes:
  postgres-db-volume:
  seaweedfs-data:
  kafka-data:
